name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[terrain,repair,dev]'
      - run: pytest --cov=camera_atlas --cov-report=xml
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.python }}
          path: dist/*
