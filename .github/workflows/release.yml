name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[terrain,repair,heic,dev,service]'
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python scripts/package_agent_kit.py --output dist/Camera-Atlas-Agent-Kit-v2.2.1.zip
      - run: python scripts/package_agensi.py --output dist/Camera-Atlas-Skill-v2.2.1.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi
