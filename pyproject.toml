[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "camera-atlas"
version = "0.1.0"
description = "Photography First. Geography Verified. Auditable editorial geographic overlays."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Camera Atlas contributors"}]
dependencies = ["Pillow>=10.4,<13", "numpy>=1.26,<3", "shapely>=2.0,<3", "pyproj>=3.6,<4", "pydantic>=2.7,<3", "typer>=0.12,<1", "httpx>=0.27,<1"]
[project.optional-dependencies]
terrain = ["rasterio>=1.3,<2", "contourpy>=1.2,<2"]
repair = ["opencv-python-headless>=4.8,<5"]
heic = ["pillow-heif>=0.18,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1.2,<2", "pyyaml>=6,<7"]
[project.scripts]
camera-atlas = "camera_atlas.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/camera_atlas"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: explicitly opt-in live data integration"]
addopts = "-ra -m 'not network'"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
